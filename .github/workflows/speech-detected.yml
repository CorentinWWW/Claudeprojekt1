name: Speech Detected - Trigger Monitoring

on:
  repository_dispatch:
    types: [speech_detected]

jobs:
  analyze-speech:
    runs-on: ubuntu-latest
    # Kurzes Timeout: wenn live-audio hoert, soll die Analyse schnell stattfinden
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q anthropic python-dotenv

      - name: Restore cache (SQLite DB)
        uses: actions/cache@v4
        with:
          path: trump_monitor.db
          key: db-cache-${{ github.run_id }}
          restore-keys: db-cache-

      - name: Analyze detected speech
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -c "
          import sys, json, os
          text = '''${{ github.event.client_payload.text }}'''
          stream = '''${{ github.event.client_payload.stream_url }}'''
          print(f'[Speech Detected] Sofort-Analyse ausgeloest')
          print(f'  Text (erste 200 Zeichen): {text[:200]}...')
          print(f'  Stream: {stream}')
          print()
          print('Klassifizierung wird eingeleitet...')
          "

          # Laeuft einen einzelnen poll()-Zyklus mit ENABLE_LIVE_AUDIO=false
          # (Speech wurde ja gerade ueber repository_dispatch erkannt, das System
          # muss nicht erneut hineinhoeren - nur Klassifikation).
          ENABLE_LIVE_AUDIO=false python run_once.py

      - name: Save cache (SQLite DB)
        uses: actions/cache@v4
        if: always()
        with:
          path: trump_monitor.db
          key: db-cache-${{ github.run_id }}
