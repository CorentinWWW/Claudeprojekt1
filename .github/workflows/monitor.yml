name: Trump Market Monitor

on:
  schedule:
    # Alle 30 Minuten. Bei oeffentlichen Repos sind GitHub-Actions-Minuten
    # unbegrenzt, dann kann man hier z.B. auf */15 verkuerzen.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_text:
        description: "Optional: Testaussage, die garantiert durch Claude+Telegram gejagt wird (leer lassen fuer normalen Lauf)"
        required: false
        default: ""

# Verhindert, dass ein manuell getriggerter Lauf und der naechste geplante Lauf
# ueberlappen: beide wuerden sonst denselben DB-Cache-Stand restaurieren, unabhaengig
# voneinander veraendern und ihre jeweils eigene (sich widersprechende) Version
# zurueckspeichern - wodurch der zuerst fertige Lauf seine Aenderungen (z.B.
# "Alert wurde verschickt") stillschweigend wieder verliert. "cancel-in-progress:
# false" laesst laufende Jobs zu Ende laufen und reiht neue nur ein, statt sie
# abzubrechen (ein abgebrochener Lauf wuerde ohnehin von _resend_pending_alerts()
# beim naechsten Mal nachgeholt, aber sequenziell ist sauberer).
concurrency:
  group: trump-market-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Grosszuegig bemessen: ein Nachrichtenschub (viele echte, unterschiedliche
    # Trump/Markt-Meldungen gleichzeitig) kann mehrere Minuten Klassifikation
    # brauchen. Lieber laenger warten als einen Lauf mitten in der Verarbeitung
    # abzubrechen (siehe _resend_pending_alerts() in orchestrator.py als
    # zusaetzliches Sicherheitsnetz, falls es doch mal knapp wird).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Haelt den Dedup-/Duplikat-Status ueber mehrere Laeufe hinweg am Leben,
      # sonst wuerde jede Meldung bei jedem Lauf erneut alarmiert werden.
      - name: Restore statement DB
        uses: actions/cache@v4
        with:
          path: trump_monitor.db
          key: trump-monitor-db-${{ github.run_id }}
          restore-keys: |
            trump-monitor-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STARTUP_NOTICE: "false"
          # Praezisions-Schwelle fuer Alerts (siehe app/config.py:
          # ALERT_MIN_TICKER_CONFIDENCE). Optional ueber eine GitHub-Repository-Variable
          # (Settings -> Secrets and variables -> Actions -> Variables) einstellbar, ohne
          # Code zu aendern. Ist die Variable nicht gesetzt, liefert GitHub hier einen
          # leeren String, den config.py wie "nicht gesetzt" behandelt -> es gilt dann der
          # Standard 0.90 aus dem Code.
          ALERT_MIN_TICKER_CONFIDENCE: ${{ vars.ALERT_MIN_TICKER_CONFIDENCE }}
          MANUAL_TEST_TEXT: ${{ github.event.inputs.test_text }}
          ENABLE_LIVE_AUDIO: "false"
          # Playwright/Chromium ist hier bewusst nicht installiert, um Laeufe
          # kurz zu halten - Truth Social nutzt in diesem Modus nur den
          # direkten (leichten) API-Call, ohne Browser-Fallback.
          TRUTH_SOCIAL_BROWSER_FALLBACK: "false"
        run: python run_once.py
