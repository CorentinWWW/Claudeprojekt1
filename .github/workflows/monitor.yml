name: Trump Market Monitor

on:
  schedule:
    # Alle 15 Minuten (vorher 30) - Latenz senken (#1): Trump-Schlagzeilen werden
    # schnell eingepreist, jede Minute frueher zaehlt. Kuerzer als */15 ist bei
    # GitHub-Actions-Cron unzuverlaessig (geplante Laeufe werden bei Last teils
    # verzoegert oder zusammengefasst) - fuer echte Sekunden-Latenz den Always-on-
    # Modus nutzen (siehe README: run_forever/Docker/systemd statt Cron). Bei
    # oeffentlichen Repos sind Actions-Minuten unbegrenzt.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_text:
        description: "Optional: Testaussage, die garantiert durch Claude+Telegram gejagt wird (leer lassen fuer normalen Lauf)"
        required: false
        default: ""

# Verhindert, dass ein manuell getriggerter Lauf und der naechste geplante Lauf
# ueberlappen: beide wuerden sonst denselben DB-Cache-Stand restaurieren, unabhaengig
# voneinander veraendern und ihre jeweils eigene (sich widersprechende) Version
# zurueckspeichern - wodurch der zuerst fertige Lauf seine Aenderungen (z.B.
# "Alert wurde verschickt") stillschweigend wieder verliert. "cancel-in-progress:
# false" laesst laufende Jobs zu Ende laufen und reiht neue nur ein, statt sie
# abzubrechen (ein abgebrochener Lauf wuerde ohnehin von _resend_pending_alerts()
# beim naechsten Mal nachgeholt, aber sequenziell ist sauberer).
concurrency:
  group: trump-market-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # WICHTIG: bewusst DEUTLICH unter dem Cron-Intervall (*/15 oben) gehalten. Ein
    # Timeout >= dem Intervall (frueher 20 bei ebenfalls */15) kann dazu fuehren, dass
    # ein Lauf noch laeuft, wenn der naechste UND uebernaechste geplante Trigger
    # feuern - "concurrency: cancel-in-progress: false" haelt aber nur GENAU EINEN
    # wartenden Lauf in der Warteschlange; ein dritter ueberlappender Trigger wird von
    # GitHub NICHT eingereiht, sondern still verworfen (kein rotes Kreuz, keine
    # Fehler-Mail - der Zyklus faellt einfach lautlos aus, ausgerechnet waehrend eines
    # Nachrichtenschubs). 10 Minuten reichen bei serieller Klassifikation
    # (MAX_CONCURRENT_CLASSIFICATIONS=1, gedeckelt durch den Tages-Kostendeckel) und
    # nebenlaeufigem RSS-Abruf (siehe news_rss.py: alle Feeds gleichzeitig statt
    # nacheinander) fuer einen normalen bis maessig starken Nachrichtenschub; ein
    # abgebrochener Lauf verliert dank _resend_pending_alerts() in orchestrator.py
    # ohnehin keine marktrelevante Meldung dauerhaft - der naechste (puenktlich
    # startende) Lauf holt sie nach.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Haelt den Dedup-/Duplikat-Status ueber mehrere Laeufe hinweg am Leben,
      # sonst wuerde jede Meldung bei jedem Lauf erneut alarmiert werden.
      - name: Restore statement DB
        uses: actions/cache@v4
        with:
          path: trump_monitor.db
          key: trump-monitor-db-${{ github.run_id }}
          restore-keys: |
            trump-monitor-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STARTUP_NOTICE: "false"
          # Praezisions-Schwelle fuer Alerts (siehe app/config.py:
          # ALERT_MIN_TICKER_CONFIDENCE). Optional ueber eine GitHub-Repository-Variable
          # (Settings -> Secrets and variables -> Actions -> Variables) einstellbar, ohne
          # Code zu aendern. Ist die Variable nicht gesetzt, liefert GitHub hier einen
          # leeren String, den config.py wie "nicht gesetzt" behandelt -> es gilt dann der
          # Standard 0.90 aus dem Code.
          ALERT_MIN_TICKER_CONFIDENCE: ${{ vars.ALERT_MIN_TICKER_CONFIDENCE }}
          MANUAL_TEST_TEXT: ${{ github.event.inputs.test_text }}
          ENABLE_LIVE_AUDIO: "false"
          # Playwright/Chromium ist hier bewusst nicht installiert, um Laeufe
          # kurz zu halten - Truth Social nutzt in diesem Modus nur den
          # direkten (leichten) API-Call, ohne Browser-Fallback.
          TRUTH_SOCIAL_BROWSER_FALLBACK: "false"
        run: python run_once.py
