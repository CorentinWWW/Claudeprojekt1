name: Market Impact Predictor

on:
  # Cron BEWUSST deaktiviert: der Dauerbetrieb laeuft jetzt im Always-on-Modus auf einer
  # eigenen VM (Docker, run_forever, Polling alle 60s - siehe README "Oracle Cloud Free
  # Tier"). Waere der Zeitplan hier zusaetzlich aktiv, liefen ZWEI Instanzen parallel:
  # beide mit eigener SQLite-DB, also ohne gemeinsame Duplikat-Erkennung/Cooldowns
  # -> doppelte Telegram-Alerts, zwei auseinanderlaufende Paper-Depots und doppelte
  # Claude-Kosten. Der Actions-Lauf bleibt als manuelle Rueckfallebene erhalten (unten
  # workflow_dispatch): faellt die VM aus, kann der Workflow im Actions-Tab jederzeit
  # per "Run workflow" von Hand gestartet werden. Zum Reaktivieren des Dauerbetriebs
  # ueber Actions einfach die beiden folgenden Zeilen wieder einkommentieren.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_text:
        description: "Optional: Testaussage, die garantiert durch Claude+Telegram gejagt wird (leer lassen fuer normalen Lauf)"
        required: false
        default: ""

# Verhindert, dass ein manuell getriggerter Lauf und der naechste geplante Lauf
# ueberlappen: beide wuerden sonst denselben DB-Cache-Stand restaurieren, unabhaengig
# voneinander veraendern und ihre jeweils eigene (sich widersprechende) Version
# zurueckspeichern - wodurch der zuerst fertige Lauf seine Aenderungen (z.B.
# "Alert wurde verschickt") stillschweigend wieder verliert. "cancel-in-progress:
# false" laesst laufende Jobs zu Ende laufen und reiht neue nur ein, statt sie
# abzubrechen (ein abgebrochener Lauf wuerde ohnehin von _resend_pending_alerts()
# beim naechsten Mal nachgeholt, aber sequenziell ist sauberer).
concurrency:
  group: trump-market-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # WICHTIG: bewusst DEUTLICH unter dem Cron-Intervall (*/5 oben) gehalten. Ein
    # Timeout >= dem Intervall kann dazu fuehren, dass ein Lauf noch laeuft, wenn der
    # naechste UND uebernaechste geplante Trigger feuern - "concurrency: cancel-in-
    # progress: false" haelt aber nur GENAU EINEN wartenden Lauf in der Warteschlange;
    # ein dritter ueberlappender Trigger wird von GitHub NICHT eingereiht, sondern still
    # verworfen (kein rotes Kreuz, keine Fehler-Mail - der Zyklus faellt einfach lautlos
    # aus, ausgerechnet waehrend eines Nachrichtenschubs). 4 Minuten reichen bei
    # MAX_CONCURRENT_CLASSIFICATIONS=2 (gedeckelt durch den Tages-Kostendeckel) und
    # nebenlaeufigem RSS-Abruf (siehe news_rss.py: alle Feeds gleichzeitig statt
    # nacheinander) fuer einen normalen bis maessig starken Nachrichtenschub - mit noch
    # mehr Puffer als zuvor bei rein serieller Klassifikation; ein abgebrochener Lauf
    # verliert dank _resend_pending_alerts() in orchestrator.py ohnehin keine
    # marktrelevante Meldung dauerhaft - der naechste (puenktlich startende) Lauf holt
    # sie nach.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Haelt den Dedup-/Duplikat-Status ueber mehrere Laeufe hinweg am Leben,
      # sonst wuerde jede Meldung bei jedem Lauf erneut alarmiert werden.
      - name: Restore statement DB
        uses: actions/cache@v4
        with:
          path: trump_monitor.db
          key: trump-monitor-db-${{ github.run_id }}
          restore-keys: |
            trump-monitor-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STARTUP_NOTICE: "false"
          # Latenz (Nutzerwunsch): serielle Claude-Klassifikation ist die dominante
          # Zeitquelle eines Poll-Zyklus (mehrere Sekunden je Meldung, oft >80% der
          # gesamten Zykluszeit). 2 statt 1 (Code-Standard) halbiert diese Phase grob,
          # bei nur geringfuegig erhoehtem Risiko doppelter Alerts fuer zwei fast
          # zeitgleiche Meldungen zum selben Thema (siehe app/config.py-Kommentar zu
          # MAX_CONCURRENT_CLASSIFICATIONS). Per Repo-Variable ueberschreibbar.
          MAX_CONCURRENT_CLASSIFICATIONS: ${{ vars.MAX_CONCURRENT_CLASSIFICATIONS || '2' }}
          # ============================================================================
          # MESS-PHASE (bewusste Entscheidung, siehe Commit-Message)
          # ----------------------------------------------------------------------------
          # Ausgangslage: mit ALERT_MIN_TICKER_CONFIDENCE=0.90 (Code-Standard) kam ueber
          # einen ganzen Handelstag KEIN EINZIGER Alert durch - die tatsaechlichen
          # Claude-Konfidenzen lagen bei 0.35-0.85. Das erste Gate hat alles abgefangen,
          # alle nachgelagerten Gates (Technik, Historie, Ensemble, VIX) wurden nie auch
          # nur erreicht.
          #
          # Folge: null ausgewertete Ergebnisse -> das Ensemble-Modell bleibt dauerhaft
          # untrainiert, das Historie-Gate hat nie Daten, und es laesst sich grundsaetzlich
          # nicht feststellen, ob das System ueberhaupt einen Edge hat. Ein System, das nie
          # alarmiert, lernt nie etwas ueber sich selbst.
          #
          # Diese Schwellen sind daher bewusst auf DATENGEWINNUNG gestellt, nicht auf
          # maximale Praezision. Es ist Paper-Trading, es steht kein Geld im Risiko. Sobald
          # ~100 ausgewertete Ergebnisse vorliegen, sollten die Werte anhand der GEMESSENEN
          # Trefferquoten nachgeschaerft werden (/api/calibration liefert dafuer sogar eine
          # konkrete Schwellen-Empfehlung) - statt wie bisher anhand von Schaetzungen.
          # Kosten/Spam bleiben durch MAX_ALERTS_PER_HOUR und MAX_CLASSIFICATIONS_PER_DAY
          # weiterhin hart gedeckelt.
          # ============================================================================
          ALERT_MIN_TICKER_CONFIDENCE: ${{ vars.ALERT_MIN_TICKER_CONFIDENCE || '0.75' }}
          MAX_NEWS_AGE_MINUTES: ${{ vars.MAX_NEWS_AGE_MINUTES || '180' }}
          TICKER_ALERT_COOLDOWN_MINUTES: ${{ vars.TICKER_ALERT_COOLDOWN_MINUTES || '60' }}
          ALERT_MIN_CONVICTION: ${{ vars.ALERT_MIN_CONVICTION || '55' }}
          MAX_ALERTS_PER_HOUR: ${{ vars.MAX_ALERTS_PER_HOUR || '5' }}
          ALERT_MIN_EXPECTED_MOVE_PCT: ${{ vars.ALERT_MIN_EXPECTED_MOVE_PCT || '1.0' }}
          # Historische-Performance-Feedback: der SCORE-Effekt bleibt an (sanft, wirkt erst
          # ab genug Samples). Das HARTE Unterdrueckungs-Gate ist dagegen auf 0 (aus):
          # bei HISTORICAL_PERFORMANCE_MIN_SAMPLES=5 waere "< 40% Trefferquote" nach fuenf
          # Trades statistisch reines Rauschen (2 von 5 Fehlschlaegen reichen) - es wuerde
          # brauchbare Ticker zufaellig dauerhaft abwuergen, bevor ueberhaupt genug Daten
          # da sind, um das zu bemerken. Wieder scharf stellen, sobald die Stichprobe je
          # Ticker aussagekraeftig ist.
          ENABLE_HISTORICAL_PERFORMANCE_GATE: ${{ vars.ENABLE_HISTORICAL_PERFORMANCE_GATE || 'true' }}
          HISTORICAL_PERFORMANCE_SUPPRESS_BELOW: ${{ vars.HISTORICAL_PERFORMANCE_SUPPRESS_BELOW || '0' }}
          # Zweitmeinung fuer Grenzfaelle: kostet einen Extra-Call (Sonnet) pro Grenzfall,
          # zaehlt gegen das Tages-Limit.
          ENABLE_BORDERLINE_ESCALATION: ${{ vars.ENABLE_BORDERLINE_ESCALATION || 'true' }}
          # Preis-Tracking / Backtesting: nach jedem Alert wird der Kurs der handelbaren
          # Ticker erfasst und nach PRICE_OUTCOME_HORIZON_MINUTES erneut gemessen - so
          # entsteht ueber die Laeufe hinweg eine ECHTE Trefferquote (Dashboard
          # /api/performance + woechentlicher Telegram-Digest) statt Bauchgefuehl. Der
          # Zustand ueberlebt einzelne Laeufe ueber den DB-Cache oben. Best-effort ueber
          # Stooq (kostenlos, kein Key); ist der Kursdienst mal nicht erreichbar, entfaellt
          # die Messung still (Circuit-Breaker), der Poll-Zyklus laeuft normal weiter.
          # '|| true' = standardmaessig AN; zum Abschalten eine Repo-Variable
          # ENABLE_PRICE_TRACKING=false setzen (Settings -> Variables), ohne Code zu aendern.
          ENABLE_PRICE_TRACKING: ${{ vars.ENABLE_PRICE_TRACKING || 'true' }}
          # Messfenster in Minuten (leer -> Code-Standard 60). Ueber eine Repo-Variable
          # einstellbar, falls du z.B. einen laengeren Horizont auswerten willst.
          PRICE_OUTCOME_HORIZON_MINUTES: ${{ vars.PRICE_OUTCOME_HORIZON_MINUTES }}
          # Paper-Trading (virtuelles Depot, KEIN echtes Geld): auf jeden Alert hin wird
          # fuer die handelbaren Ticker eine virtuelle Position eroeffnet (Einstiegskurs
          # gemerkt), laufend bewertet und per Telegram gemeldet ("auf wie viel steht es").
          # Stop/Ziel schliessen automatisch. Der Depot-Zustand ueberlebt einzelne Laeufe
          # ueber den DB-Cache oben. '|| true' = standardmaessig AN; zum Abschalten eine
          # Repo-Variable PAPER_TRADING=false setzen. Startkapital ueber PAPER_STARTING_CAPITAL
          # (Standard 500 EUR) anpassbar.
          PAPER_TRADING: ${{ vars.PAPER_TRADING || 'true' }}
          PAPER_STARTING_CAPITAL: ${{ vars.PAPER_STARTING_CAPITAL }}
          # Kapital-Recycling: ohne Zeit-Exit bliebe eine Position, die weder Stop noch
          # Ziel erreicht, unbegrenzt offen und wuerde ihren Einsatz dauerhaft binden -
          # nach den ersten Alerts bekaeme mangels freiem Kapital KEIN weiterer Alert
          # mehr eine Position.
          PAPER_MAX_HOLDING_HOURS: ${{ vars.PAPER_MAX_HOLDING_HOURS || '24' }}
          # Trailing-Stop: ohne ihn ist der Gewinn je Trade bei ~1.5R gedeckelt, der
          # Verlust bei 1R - rechnerisch braeuchte das 40% Trefferquote nur fuers
          # Break-even. Der Trail laesst stark laufende Bewegungen weiter laufen.
          PAPER_TRAILING_STOP: ${{ vars.PAPER_TRAILING_STOP || 'true' }}
          # Handelskosten je Seite in Basispunkten - macht die ausgewiesene Paper-Rendite
          # ehrlich (ohne Abzug sieht sie systematisch besser aus als die Realitaet).
          PAPER_COST_BPS: ${{ vars.PAPER_COST_BPS || '10' }}
          # Technische Analyse (TradingView-Stil): technische Gesamtbewertung je Ticker aus
          # der Kurshistorie (Stooq), als Bestaetigung/Widerspruch zum Nachrichtensignal.
          # Die Anzeige + der SCORE-Effekt (TECHNICALS_CONVICTION_WEIGHT) bleiben an.
          # TECHNICALS_REQUIRE_AGREEMENT (hartes Unterdruecken bei klarem Widerspruch) ist
          # dagegen fuer die Mess-Phase AUS: dass die Technik ein Nachrichtensignal
          # zuverlaessig widerlegt, ist eine unbelegte Annahme - als hartes Filter wuerde
          # sie stillschweigend genau die Faelle entfernen, an denen sich diese Annahme
          # ueberhaupt erst pruefen liesse. Wieder einschalten, sobald die Daten zeigen,
          # dass technisch widersprochene Alerts tatsaechlich schlechter abschneiden
          # (dafuer gibt es /api/gate-stats).
          ENABLE_TECHNICALS: ${{ vars.ENABLE_TECHNICALS || 'true' }}
          TECHNICALS_REQUIRE_AGREEMENT: ${{ vars.TECHNICALS_REQUIRE_AGREEMENT || 'false' }}
          # Ensemble-Modell (Bag-of-Words-Naive-Bayes, siehe app/ensemble.py): klassische,
          # von Claude UNABHAENGIGE Zweitmeinung aus der eigenen bisherigen Erfolgsbilanz.
          # '|| true' = standardmaessig AN; zum Abschalten Repo-Variable
          # ENABLE_ENSEMBLE_MODEL=false setzen. Braucht mindestens
          # ENSEMBLE_MIN_TRAINING_SAMPLES (Code-Standard 30) ausgewertete Alerts BEIDER
          # Klassen (Treffer UND Fehlschlag), bis dahin bleibt es wirkungslos - das
          # Einschalten hier ist also gefahrlos, auch wenn die DB noch leer ist.
          # ENSEMBLE_SUPPRESS_BELOW bewusst NICHT gesetzt (Code-Standard 0.0 = kein hartes
          # Unterdruecken, nur ein sanfter Zu-/Abschlag auf den Ueberzeugungs-Score) - bei
          # einem neuen, noch unbewiesenen Signal soll es zunaechst nur mitschwingen statt
          # gleich Alerts zu blockieren.
          ENABLE_ENSEMBLE_MODEL: ${{ vars.ENABLE_ENSEMBLE_MODEL || 'true' }}
          # VIX-Marktregime-Gate (siehe app/orchestrator.py): marktweiter Angst-Indikator
          # (Stooq ^vix, kostenlos) - bei hoher Angst wird der Ueberzeugungs-Score
          # abgewertet. '|| true' = standardmaessig AN; zum Abschalten Repo-Variable
          # ENABLE_VIX_GATE=false setzen. VIX_SUPPRESS_ABOVE bleibt Code-Standard 0 (kein
          # hartes Unterdruecken), das Gate wirkt also nur als sanfter Score-Effekt.
          ENABLE_VIX_GATE: ${{ vars.ENABLE_VIX_GATE || 'true' }}
          MANUAL_TEST_TEXT: ${{ github.event.inputs.test_text }}
          # Playwright/Chromium ist hier bewusst nicht installiert, um Laeufe
          # kurz zu halten - Truth Social nutzt in diesem Modus nur den
          # direkten (leichten) API-Call, ohne Browser-Fallback.
          TRUTH_SOCIAL_BROWSER_FALLBACK: "false"
        run: python run_once.py
