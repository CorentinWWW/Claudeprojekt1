<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Trump Market Impact Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
    background: #0b0d10;
    color: #e6e6e6;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1rem; margin: 0 0 0.5rem; color: #c7c7c7; }
  .subtitle { color: #9aa0a6; font-size: 0.85rem; margin-bottom: 1.25rem; }

  .banner {
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  .banner.error { background: #3a1414; border: 1px solid #7a2020; color: #ffb3b3; }
  .banner.warning { background: #3a3014; border: 1px solid #7a6420; color: #ffe2a8; }

  .panel {
    border: 1px solid #2a2f36;
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 1rem;
    background: #14171c;
  }

  .status-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .status-chip {
    display: flex; align-items: center; gap: 0.4rem;
    background: #1c2027; border-radius: 8px; padding: 0.3rem 0.6rem;
    font-size: 0.78rem; color: #c7c7c7;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: #2ecc71; }
  .dot.warn { background: #f1c40f; }
  .dot.error { background: #e74c3c; }
  .dot.unknown { background: #555; }

  .stats-row { display: flex; flex-wrap: wrap; gap: 1.5rem; }
  .stat { min-width: 90px; }
  .stat .value { font-size: 1.3rem; font-weight: 600; }
  .stat .label { font-size: 0.72rem; color: #9aa0a6; }
  .stat.positive .value { color: #2ecc71; }
  .stat.negative .value { color: #e74c3c; }

  .test-form { display: flex; flex-direction: column; gap: 0.5rem; }
  textarea {
    background: #0b0d10; color: #e6e6e6; border: 1px solid #2a2f36; border-radius: 8px;
    padding: 0.6rem; font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 4.5rem;
  }
  .test-form-row { display: flex; gap: 0.75rem; align-items: center; }
  button {
    background: #2d6fe0; color: white; border: none; border-radius: 8px;
    padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer;
  }
  button:disabled { background: #444; cursor: default; }
  #testResult { font-size: 0.85rem; white-space: pre-wrap; margin-top: 0.4rem; }

  .filters { margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; }
  .card {
    border: 1px solid #2a2f36;
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.75rem;
    background: #14171c;
  }
  .card.positive { border-left: 4px solid #2ecc71; }
  .card.negative { border-left: 4px solid #e74c3c; }
  .card.neutral  { border-left: 4px solid #7f8c8d; }
  .card.duplicate { opacity: 0.55; }
  .meta { font-size: 0.75rem; color: #9aa0a6; margin-bottom: 0.4rem; }
  .text { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .tags { font-size: 0.8rem; color: #c7c7c7; }
  .tag {
    display: inline-block;
    background: #23272e;
    border-radius: 6px;
    padding: 0.1rem 0.5rem;
    margin-right: 0.3rem;
  }
  a { color: #6ea8fe; }
  .empty { color: #9aa0a6; font-style: italic; }
  label { font-size: 0.85rem; color: #c7c7c7; }
</style>
</head>
<body>
  <h1>🗽 Trump Market Impact Monitor</h1>
  <div class="subtitle">
    Automatische Einschätzung via Claude – keine Finanzberatung. Aktualisiert alle 15s.
  </div>

  <div id="banners">
    <div id="authBanner"></div>
    <div id="healthBanners"></div>
  </div>

  <div class="panel">
    <h2>Zugriff</h2>
    <div class="test-form-row">
      <input type="password" id="apiKeyInput" placeholder="X-API-Key (falls DASHBOARD_API_KEY gesetzt ist)" style="flex:1; background:#0b0d10; color:#e6e6e6; border:1px solid #2a2f36; border-radius:8px; padding:0.5rem;">
      <button onclick="saveApiKey()">Speichern</button>
    </div>
  </div>

  <div class="panel">
    <h2>Status der Quellen</h2>
    <div class="status-row" id="statusRow"></div>
  </div>

  <div class="panel">
    <h2>Statistik</h2>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <div class="panel">
    <h2>Pipeline testen</h2>
    <div class="test-form">
      <textarea id="testText" placeholder="z.B. Ich werde 25% Zölle auf alle importierten Autos erheben.">Ich werde 25% Zölle auf alle importierten Halbleiter erheben, das betrifft auch Taiwan.</textarea>
      <div class="test-form-row">
        <button id="testBtn" onclick="runTest()">Durch Claude jagen</button>
        <label><input type="checkbox" id="testTelegram" checked> Bei Relevanz auch Telegram-Alert senden</label>
      </div>
      <div id="testResult"></div>
    </div>
  </div>

  <div class="filters">
    <label><input type="checkbox" id="onlyRelevant"> Nur marktrelevante Aussagen</label>
  </div>
  <div id="feed"></div>

<script>
const feed = document.getElementById('feed');
const onlyRelevant = document.getElementById('onlyRelevant');

function sentimentClass(s) {
  return ['positive', 'negative', 'neutral'].includes(s) ? s : 'neutral';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// escapeHtml() ist NICHT sicher fuer die Verwendung innerhalb eines HTML-Attributs
// (z.B. title="..."): das textContent/innerHTML-Roundtrip escaped &, < und >, aber
// KEINE Anfuehrungszeichen (die sind nur in Text-Knoten unkritisch, nicht in
// Attribut-Werten) - ein `"` im Text wuerde sonst aus dem Attribut ausbrechen und
// z.B. einen onmouseover-Handler injizieren koennen.
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getApiKey() {
  return localStorage.getItem('dashboardApiKey') || '';
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (val) {
    localStorage.setItem('dashboardApiKey', val);
  } else {
    localStorage.removeItem('dashboardApiKey');
  }
  refreshAll();
}

async function apiFetch(url, options = {}) {
  const key = getApiKey();
  const headers = Object.assign({}, options.headers || {});
  if (key) headers['X-API-Key'] = key;
  const res = await fetch(url, Object.assign({}, options, { headers }));
  // Eigener #authBanner-Container statt in #banners hineinzuschreiben: loadHealth()
  // (unauthentifiziert, siehe unten) laeuft parallel via Promise.all in refreshAll()
  // und wuerde ein gemeinsames #banners.innerHTML nicht-deterministisch ueberschreiben
  // - je nach Promise-Reihenfolge verschwand die 401-Meldung dadurch wieder. Jede
  // Quelle schreibt jetzt nur noch in ihren eigenen, festen Container.
  const authBanner = document.getElementById('authBanner');
  if (res.status === 401) {
    authBanner.innerHTML =
      '<div class="banner error">⛔ Fehlender/falscher API-Key - oben unter "Zugriff" den korrekten X-API-Key eintragen.</div>';
  } else {
    authBanner.innerHTML = '';
  }
  return res;
}

// Nur http(s)-Links werden je gerendert - ein Statement-Text/URL-Feld kommt letztlich
// aus externen Quellen (RSS/GDELT/Truth Social); ohne Schema-Pruefung koennte eine
// "javascript:"-URL in href="..." beim Klick Code im Dashboard-Origin ausfuehren (der
// auch den DASHBOARD_API_KEY in localStorage haelt) - escapeAttr() allein schuetzt nur
// vor dem Ausbrechen aus dem Attribut, nicht vor einem gefaehrlichen Schema selbst.
function safeUrl(url) {
  try {
    const parsed = new URL(url, window.location.href);
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : null;
  } catch {
    return null;
  }
}

function timeAgo(ts) {
  if (!ts) return 'nie';
  const secs = Math.round(Date.now() / 1000 - ts);
  if (secs < 60) return `vor ${secs}s`;
  if (secs < 3600) return `vor ${Math.round(secs / 60)}min`;
  return `vor ${Math.round(secs / 3600)}h`;
}

async function loadFeed() {
  const params = new URLSearchParams({
    limit: '50',
    only_relevant: onlyRelevant.checked ? 'true' : 'false',
  });
  const res = await apiFetch('/api/statements?' + params.toString());
  const items = await res.json();

  if (!items.length) {
    feed.innerHTML = '<div class="empty">Noch keine Statements erfasst.</div>';
    return;
  }

  feed.innerHTML = items.map(renderCard).join('');
}

function directionArrow(direction) {
  if (direction === 'long') return '🔺';
  if (direction === 'short') return '🔻';
  return '◽';
}

function renderTickerCalls(tickerCalls) {
  if (!tickerCalls || !tickerCalls.length) return '–';
  // Gleiche Darstellung wie im Telegram-Alert: nach Ticker-Konfidenz absteigend
  // sortiert (sicherste Einschaetzung zuerst) und mit Prozent-Angabe. Alte DB-Zeilen
  // ohne confidence-Feld (vor dessen Einfuehrung) werden ans Ende sortiert und ohne
  // Prozent angezeigt statt ein irrefuehrendes "0%" zu behaupten.
  const sorted = [...tickerCalls].sort((a, b) => (b.confidence || 0) - (a.confidence || 0));
  return sorted.map(tc => {
    const conf = tc.confidence != null ? ` ${Math.round(tc.confidence * 100)}%` : '';
    const label = tc.direction ? `${tc.ticker} (${tc.direction})${conf}` : `${tc.ticker}${conf}`;
    const title = tc.reasoning ? ` title="${escapeAttr(tc.reasoning)}"` : '';
    return `<span class="tag"${title}>${directionArrow(tc.direction)} ${escapeHtml(label)}</span>`;
  }).join('');
}

function renderCard(item) {
  const date = new Date(item.ingested_at * 1000).toLocaleString('de-DE');
  const isDup = item.duplicate_of_id != null;
  const relevant = isDup
    ? `↔ Duplikat von #${item.duplicate_of_id}`
    : (item.is_market_relevant ? '✅ marktrelevant' : '— nicht marktrelevant');
  const conf = item.confidence != null ? Math.round(item.confidence * 100) + '%' : '–';
  const tickers = renderTickerCalls(item.tickers);
  const sectors = (item.sectors || []).map(s => `<span class="tag">${escapeHtml(s)}</span>`).join('') || '–';
  const itemUrl = item.url ? safeUrl(item.url) : null;
  const link = itemUrl ? `<a href="${escapeAttr(itemUrl)}" target="_blank">Quelle</a>` : '';

  return `
    <div class="card ${sentimentClass(item.sentiment)}${isDup ? ' duplicate' : ''}">
      <div class="meta">${date} · ${escapeHtml(item.source)} · ${relevant} · Konfidenz ${conf}</div>
      <div class="text">${escapeHtml(item.text)}</div>
      <div class="tags">Ticker: ${tickers} &nbsp; Sektoren: ${sectors}</div>
      ${item.reasoning ? `<div class="tags" style="margin-top:0.3rem;">${escapeHtml(item.reasoning)}</div>` : ''}
      <div style="margin-top:0.4rem;">${link}</div>
    </div>
  `;
}

async function loadHealth() {
  // Bewusst normales fetch() statt apiFetch(): /api/health ist serverseitig absichtlich
  // OHNE Auth erreichbar (siehe app/dashboard.py). Ueber apiFetch() liefe dieser Call
  // durch dieselbe 401/Erfolgs-Behandlung wie die authentifizierten Endpunkte und
  // wuerde - da alle refreshAll()-Aufrufe parallel per Promise.all laufen - je nach
  // Timing den echten #authBanner-Status von loadFeed()/loadStats() wieder loeschen.
  const res = await fetch('/api/health');
  const health = await res.json();

  const healthBanners = document.getElementById('healthBanners');
  healthBanners.innerHTML = [
    ...health.errors.map(e => `<div class="banner error">⛔ ${escapeHtml(e)}</div>`),
    ...health.warnings.map(w => `<div class="banner warning">⚠️ ${escapeHtml(w)}</div>`),
  ].join('');

  const statusRow = document.getElementById('statusRow');
  const entries = Object.entries(health.sources || {});
  const chips = entries.map(([name, s]) => {
    let dotClass = 'unknown';
    if (s.last_success_at) dotClass = 'ok';
    if (s.last_error && (s.last_error_at || 0) > (s.last_success_at || 0)) dotClass = 'warn';
    return `<div class="status-chip"><span class="dot ${dotClass}"></span>
      <span>${escapeHtml(name)} · letzter Poll ${timeAgo(s.last_poll_at)} · ${s.total_fetched} gesamt</span></div>`;
  });

  // Kostentransparenz: wie viel vom Tages-Kostendeckel (MAX_CLASSIFICATIONS_PER_DAY)
  // ist heute schon verbraucht? Grün < 80%, gelb ab 80% des normalen Limits bzw. im
  // Reserve-Bereich (nur noch wichtige Meldungen), rot erst wenn auch die Reserve
  // (Priority-Limit) ausgeschöpft ist.
  if (health.classification_calls_today != null && health.classification_calls_limit != null) {
    const used = health.classification_calls_today;
    const limit = health.classification_calls_limit;
    const priorityLimit = health.classification_calls_priority_limit || limit;
    let dotClass = 'ok';
    let suffix = '';
    if (used >= priorityLimit) {
      dotClass = 'error';
    } else if (used >= limit) {
      dotClass = 'warn';
      suffix = ' · nur noch wichtige Meldungen';
    } else if (used >= limit * 0.8) {
      dotClass = 'warn';
    }
    const cap = priorityLimit > limit ? `${limit} (+${priorityLimit - limit} Reserve)` : `${limit}`;
    chips.push(`<div class="status-chip"><span class="dot ${dotClass}"></span>
      <span>Claude-Calls heute: ${used}/${cap}${suffix}</span></div>`);
  }

  statusRow.innerHTML = chips.length ? chips.join('') : '<span class="empty">Keine Quellen aktiv.</span>';
}

async function loadStats() {
  const res = await apiFetch('/api/stats');
  const stats = await res.json();
  const sentiment = stats.sentiment_breakdown || {};

  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <div class="stat"><div class="value">${stats.total}</div><div class="label">Statements gesamt</div></div>
    <div class="stat"><div class="value">${stats.market_relevant}</div><div class="label">Marktrelevant</div></div>
    <div class="stat positive"><div class="value">${sentiment.positive || 0}</div><div class="label">Positiv</div></div>
    <div class="stat negative"><div class="value">${sentiment.negative || 0}</div><div class="label">Negativ</div></div>
    <div class="stat"><div class="value">${stats.alerts_sent}</div><div class="label">Alerts gesendet</div></div>
    <div class="stat"><div class="value">${stats.duplicates}</div><div class="label">Duplikate übersprungen</div></div>
  `;
}

async function runTest() {
  const btn = document.getElementById('testBtn');
  const resultEl = document.getElementById('testResult');
  const text = document.getElementById('testText').value.trim();
  if (!text) return;

  btn.disabled = true;
  resultEl.textContent = 'Sende an Claude…';
  try {
    const res = await apiFetch('/api/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text,
        send_telegram: document.getElementById('testTelegram').checked,
      }),
    });
    if (!res.ok) {
      resultEl.textContent = `Fehler (${res.status}): ${await res.text()}`;
      return;
    }
    const data = await res.json();
    const c = data.classification;
    const tickerStr = (c.ticker_calls || []).map(tc => `${tc.ticker} (${tc.direction})`).join(', ') || '–';
    resultEl.textContent =
      `marktrelevant: ${c.is_market_relevant} | sentiment: ${c.sentiment} | ` +
      `konfidenz: ${Math.round(c.confidence * 100)}%\n` +
      `ticker: ${tickerStr} | sektoren: ${(c.sectors || []).join(', ') || '–'}\n` +
      `begründung: ${c.reasoning}\n` +
      `Telegram-Alert gesendet: ${data.alert_sent}`;
    loadFeed();
    loadStats();
  } catch (err) {
    resultEl.textContent = 'Fehler: ' + err;
  } finally {
    btn.disabled = false;
  }
}

async function refreshAll() {
  await Promise.all([loadFeed(), loadHealth(), loadStats()]);
}

document.getElementById('apiKeyInput').value = getApiKey();
onlyRelevant.addEventListener('change', loadFeed);
refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
